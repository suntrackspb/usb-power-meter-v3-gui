name: Build and draft release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi

      - name: Install Python dependencies
        if: matrix.platform != 'linux'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build with PyInstaller (macOS)
        if: matrix.platform == 'macos'
        run: pyinstaller --noconfirm --clean --name RFPowerMeterConsole --windowed --icon assets/icon.icns --add-data "web:web" --add-data "assets:assets" main.py

      - name: Build with PyInstaller (Windows)
        if: matrix.platform == 'windows'
        run: pyinstaller --noconfirm --clean --name RFPowerMeterConsole --onefile --windowed --icon assets\icon.ico --add-data "web;web" --add-data "assets;assets" main.py

      - name: Package macOS artifact
        if: matrix.platform == 'macos'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent RFPowerMeterConsole.app "RFPowerMeterConsole-${VERSION}-macos.zip"

      - name: Package Linux artifact (deb)
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist
          PKG_ROOT=deb-root
          APP_DIR="$PKG_ROOT/opt/rfpowermeterconsole"
          mkdir -p "$PKG_ROOT/DEBIAN" "$APP_DIR" \
            "$PKG_ROOT/usr/bin" "$PKG_ROOT/usr/share/applications" \
            "$PKG_ROOT/usr/share/icons/hicolor/256x256/apps"

          pip install --no-compile --target "$APP_DIR/vendor" -r requirements.txt
          cp main.py "$APP_DIR/"
          cp -r powermeter web assets "$APP_DIR/"
          cp assets/icon-256.png "$PKG_ROOT/usr/share/icons/hicolor/256x256/apps/rfpowermeterconsole.png"

          printf '%s\n' \
            '#!/bin/sh' \
            'export PYTHONPATH="/opt/rfpowermeterconsole/vendor${PYTHONPATH:+:$PYTHONPATH}"' \
            'exec python3 -B /opt/rfpowermeterconsole/main.py "$@"' \
            > "$PKG_ROOT/usr/bin/rfpowermeterconsole"
          chmod 755 "$PKG_ROOT/usr/bin/rfpowermeterconsole"

          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=RF Power Meter Console' \
            'Exec=rfpowermeterconsole' \
            'Icon=rfpowermeterconsole' \
            'Categories=Utility;Electronics;' \
            'Terminal=false' \
            > "$PKG_ROOT/usr/share/applications/rfpowermeterconsole.desktop"

          printf '%s\n' \
            'Package: rfpowermeterconsole' \
            "Version: $VERSION" \
            'Section: utils' \
            'Priority: optional' \
            'Architecture: amd64' \
            'Depends: python3 (>= 3.8), python3-gi, python3-gi-cairo, gir1.2-gtk-3.0, gir1.2-webkit2-4.1 | gir1.2-webkit2-4.0' \
            'Maintainer: RF Power Meter Console' \
            'Description: Desktop app for the USB RF Power Meter v3' \
            > "$PKG_ROOT/DEBIAN/control"

          dpkg-deb --root-owner-group --build "$PKG_ROOT" "dist/RFPowerMeterConsole-${VERSION}-linux.deb"

      - name: Package Windows artifact
        if: matrix.platform == 'windows'
        run: |
          cd dist
          Compress-Archive -Path RFPowerMeterConsole.exe -DestinationPath "RFPowerMeterConsole-${env:VERSION}-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*
