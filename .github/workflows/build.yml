name: Build and draft release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_NAME: RFPowerMeterConsole
  PYTHON_VERSION: "3.12"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
          - os: macos-13
            platform: macos-x86_64
          - os: windows-latest
            platform: windows
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Linux собирается поверх системного python3 (см. job-шаги ниже),
      # чтобы вендоренные колёса совпадали с интерпретатором из Depends.
      - uses: actions/setup-python@v5
        if: matrix.platform != 'linux'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Determine version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi

      # ---------------------------------------------------------------- macOS
      - name: Install dependencies (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: pyinstaller --noconfirm --clean build.spec

      - name: Ad-hoc sign (macOS)
        if: startsWith(matrix.platform, 'macos')
        # Без подписи Gatekeeper объявляет скачанный .app «повреждённым».
        run: |
          codesign --force --deep --sign - "dist/${APP_NAME}.app"
          codesign --verify --deep --strict --verbose=2 "dist/${APP_NAME}.app"

      - name: Smoke test (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: "dist/${APP_NAME}.app/Contents/MacOS/${APP_NAME} --selftest"

      - name: Package (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "${APP_NAME}.app" \
            "${APP_NAME}-${VERSION}-${{ matrix.platform }}.zip"

      # -------------------------------------------------------------- Windows
      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        run: pyinstaller --noconfirm --clean build.spec

      - name: Smoke test (Windows)
        if: matrix.platform == 'windows'
        # windowed-сборка не имеет консоли: ждём процесс и читаем код возврата,
        # а отчёт забираем из selftest.log.
        run: |
          $exe = "dist\$env:APP_NAME\$env:APP_NAME.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow
          if (Test-Path selftest.log) { Get-Content selftest.log }
          if ($proc.ExitCode -ne 0) { throw "selftest failed with exit code $($proc.ExitCode)" }

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        run: |
          Compress-Archive -Path "dist\$env:APP_NAME\*" `
            -DestinationPath "dist\$env:APP_NAME-$env:VERSION-windows.zip"

      # ---------------------------------------------------------------- Linux
      - name: Install build tooling (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-pip python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 xvfb

      - name: Package (deb)
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          mkdir -p dist
          PKG_ROOT=deb-root
          APP_DIR="$PKG_ROOT/opt/rfpowermeterconsole"
          ARCH="$(dpkg --print-architecture)"
          # Колёса вендорим ТЕМ ЖЕ python3, который указан в Depends.
          PY_MINOR="$(/usr/bin/python3 -c 'import sys; print(sys.version_info[1])')"

          mkdir -p "$PKG_ROOT/DEBIAN" "$APP_DIR" \
            "$PKG_ROOT/usr/bin" "$PKG_ROOT/usr/share/applications" \
            "$PKG_ROOT/usr/share/icons/hicolor/256x256/apps"

          /usr/bin/python3 -m pip install --no-compile --break-system-packages \
            --target "$APP_DIR/vendor" -r requirements.txt
          cp main.py "$APP_DIR/"
          cp -r powermeter web assets "$APP_DIR/"
          cp assets/icon-256.png "$PKG_ROOT/usr/share/icons/hicolor/256x256/apps/rfpowermeterconsole.png"

          printf '%s\n' \
            '#!/bin/sh' \
            'export PYTHONPATH="/opt/rfpowermeterconsole/vendor${PYTHONPATH:+:$PYTHONPATH}"' \
            'exec python3 -B /opt/rfpowermeterconsole/main.py "$@"' \
            > "$PKG_ROOT/usr/bin/rfpowermeterconsole"
          chmod 755 "$PKG_ROOT/usr/bin/rfpowermeterconsole"

          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=RF Power Meter Console' \
            'Exec=rfpowermeterconsole' \
            'Icon=rfpowermeterconsole' \
            'Categories=Utility;Electronics;' \
            'Terminal=false' \
            > "$PKG_ROOT/usr/share/applications/rfpowermeterconsole.desktop"

          printf '%s\n' \
            'Package: rfpowermeterconsole' \
            "Version: $VERSION" \
            'Section: utils' \
            'Priority: optional' \
            "Architecture: $ARCH" \
            "Depends: python3 (>= 3.${PY_MINOR}), python3-gi, python3-gi-cairo, gir1.2-gtk-3.0, gir1.2-webkit2-4.1 | gir1.2-webkit2-4.0" \
            'Maintainer: RF Power Meter Console' \
            'Description: Desktop app for the USB RF Power Meter v3' \
            > "$PKG_ROOT/DEBIAN/control"

          dpkg-deb --root-owner-group --build "$PKG_ROOT" \
            "dist/${APP_NAME}-${VERSION}-linux-${ARCH}.deb"
          dpkg-deb --info "dist/${APP_NAME}-${VERSION}-linux-${ARCH}.deb"

      - name: Smoke test (Linux, installs the real .deb)
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          sudo apt-get install -y ./dist/*.deb
          xvfb-run -a rfpowermeterconsole --selftest

      # --------------------------------------------------------------- upload
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: artifacts/*
